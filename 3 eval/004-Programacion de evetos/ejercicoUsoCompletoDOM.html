<!--
Crea una página que simule una tienda online. La aplicación contendrá:
	- Un contenedor exterior que represente el bloque general de la tienda
	- Este bloque contiene tarjetas para cada producto concreto
		- Se puede resaltar cada producto al clicar en el
		- El producto contiene un botón para añadirlo al carrito
	- Una funcionalidad de carrito
	- El objeto en el carrito tiene:
		- Nombre
		- Precio
		- Cantidad
		- Botón de incrementar cantidad
		- Botón de disminuir cantidad
			- Si una cantidad llega a 0 el objeto es eliminado del carrito
	- Se puede seleccionar el objeto para resaltarlo
	- Modificar una cantidad recalcula el precio total del carrito

Características generales:
	- Todos los listeners irán dentro de los contenedores grandes
	- Los objetos del carrito serán creados de 0
	- Para obtener los datos de cada componente del dom se tiene que navegar dentro de este
	- Los botones serán identificados con una propiedad específica
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Examen Final DOM: Tienda Online Completa</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; padding: 20px; display: flex; gap: 20px; }
    
    /* Contenedores Principales */
    .seccion { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    #bloqueTienda { flex: 2; }
    #bloqueCarrito { flex: 1.5; border-left: 4px solid #e2e8f0; }

    /* Tarjetas de Producto */
    .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .producto { border: 2px solid #e2e8f0; padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
    .producto.resaltado { border-color: #3b82f6; background-color: #eff6ff; }
    .producto h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
    
    /* Carrito */
    .tabla-carrito { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .tabla-carrito th { text-align: left; padding: 10px; border-bottom: 2px solid #eee; }
    .fila-carrito { cursor: pointer; border-bottom: 1px solid #f1f5f9; }
    .fila-carrito td { padding: 10px; }
    .fila-carrito.resaltada { background-color: #fef9c3; }

    /* Botones y Utilidades */
    button { cursor: pointer; padding: 5px 10px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
    .btn-add { width: 100%; background: #22c55e; color: white; border: none; margin-top: 10px; }
    .btn-qty { background: #f1f5f9; width: 30px; }
    .total-footer { margin-top: 20px; font-size: 1.4rem; text-align: right; color: #1e293b; border-top: 2px solid #1e293b; padding-top: 10px; }
  </style>
</head>
<body>

  <section id="bloqueTienda" class="seccion">
    <h2>Catálogo de Productos</h2>
    <div class="grid-productos">
      
      <article class="producto" data-nombre="Ratón Gaming" data-precio="45">
        <h3>Ratón Gaming</h3>
        <p>Precio: <strong>45€</strong></p>
        <button data-action="add" class="btn-add">Añadir al carrito</button>
      </article>

      <article class="producto" data-nombre="Teclado Mecánico" data-precio="85">
        <h3>Teclado Mecánico</h3>
        <p>Precio: <strong>85€</strong></p>
        <button data-action="add" class="btn-add">Añadir al carrito</button>
      </article>

      <article class="producto" data-nombre="Monitor 24'" data-precio="150">
        <h3>Monitor 24"</h3>
        <p>Precio: <strong>150€</strong></p>
        <button data-action="add" class="btn-add">Añadir al carrito</button>
      </article>

    </div>
  </section>

  <section id="bloqueCarrito" class="seccion">
    <h2>Tu Carrito</h2>
    <table class="tabla-carrito">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cant.</th>
          <th>Precio</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="cuerpoCarrito">
        </tbody>
    </table>
    <div class="total-footer">
      Total: <span id="sumaTotal">0</span>€
    </div>
  </section>

  <script>
    // Referencias a los contenedores grandes para los Listeners
    const tienda = document.getElementById('bloqueTienda');
    const carrito = document.getElementById('bloqueCarrito');
    const cuerpoCarrito = document.getElementById('cuerpoCarrito');

    /* ============================================================
       1. LISTENER DE TIENDA (Delegación de eventos)
       ============================================================ */
    tienda.addEventListener('click', function(e) {
      // Localizamos la tarjeta de producto más cercana (navegación ascendente)
      const tarjeta = e.target.closest('.producto');
      if (!tarjeta) return;

      // Acción A: Resaltar producto (solo uno a la vez)
      if (e.target.dataset.action !== "add") {
        document.querySelectorAll('.producto').forEach(p => p.classList.remove('resaltado'));
        tarjeta.classList.add('resaltado');
      }

      // Acción B: Añadir al carrito
      if (e.target.dataset.action === "add") {
        // Navegación dentro del DOM para obtener datos de la tarjeta
        const nombre = tarjeta.getAttribute('data-nombre');
        const precio = parseFloat(tarjeta.getAttribute('data-precio'));
        
        agregarOActualizarCarrito(nombre, precio);
      }
    });

    /* ============================================================
       2. LÓGICA DE CREACIÓN Y ACTUALIZACIÓN (Creación de 0)
       ============================================================ */
    function agregarOActualizarCarrito(nombre, precio) {
      // Comprobar si ya existe navegando por el cuerpo del carrito
      const filasExistentes = cuerpoCarrito.querySelectorAll('.fila-carrito');
      let encontrada = null;

      filasExistentes.forEach(fila => {
        if (fila.querySelector('.nombre-cart').textContent === nombre) {
          encontrada = fila;
        }
      });

      if (encontrada) {
        modificarCantidad(encontrada, 1);
      } else {
        // Crear de 0 el objeto en el carrito
        const tr = document.createElement('tr');
        tr.className = 'fila-carrito';
        tr.setAttribute('data-precio-base', precio);
        tr.setAttribute('data-cantidad', 1);

        tr.innerHTML = `
          <td class="nombre-cart">${nombre}</td>
          <td>
            <button data-action="minus" class="btn-qty">-</button>
            <span class="cant-val">1</span>
            <button data-action="plus" class="btn-qty">+</button>
          </td>
          <td>${precio}€</td>
          <td class="subtotal-cart">${precio}€</td>
        `;

        cuerpoCarrito.appendChild(tr);
      }
      recalcularTotal();
    }

    /* ============================================================
       3. LISTENER DE CARRITO (Delegación de eventos)
       ============================================================ */
    carrito.addEventListener('click', function(e) {
      const fila = e.target.closest('.fila-carrito');
      if (!fila) return;

      // Acción A: Resaltar objeto del carrito
      if (!e.target.dataset.action) {
        document.querySelectorAll('.fila-carrito').forEach(f => f.classList.remove('resaltada'));
        fila.classList.add('resaltada');
      }

      // Acción B: Botones Incrementar/Disminuir (identificados por data-action)
      if (e.target.dataset.action === "plus") {
        modificarCantidad(fila, 1);
      }
      
      if (e.target.dataset.action === "minus") {
        modificarCantidad(fila, -1);
      }
    });

    /* ============================================================
       4. FUNCIONES DE APOYO (Navegación y Cálculos)
       ============================================================ */
    function modificarCantidad(fila, cambio) {
      // Navegación jerárquica para obtener atributos y elementos
      let cantActual = parseInt(fila.getAttribute('data-cantidad'));
      const precioBase = parseFloat(fila.getAttribute('data-precio-base'));
      
      cantActual += cambio;

      if (cantActual <= 0) {
        // Eliminación del objeto si llega a 0 (eliminacionYRemplazoDeElementos.html)
        fila.parentElement.removeChild(fila);
      } else {
        // Actualizar datos y vista
        fila.setAttribute('data-cantidad', cantActual);
        fila.querySelector('.cant-val').textContent = cantActual;
        
        const nuevoSubtotal = cantActual * precioBase;
        fila.querySelector('.subtotal-cart').textContent = nuevoSubtotal + "€";
      }
      
      recalcularTotal();
    }

    function recalcularTotal() {
      let total = 0;
      const filas = cuerpoCarrito.querySelectorAll('.fila-carrito');
      
      filas.forEach(fila => {
        // Navegación: Obtener el subtotal de cada fila
        const subtotalStr = fila.querySelector('.subtotal-cart').textContent;
        total += parseFloat(subtotalStr);
      });

      document.getElementById('sumaTotal').textContent = total;
    }
  </script>
</body>
</html>
