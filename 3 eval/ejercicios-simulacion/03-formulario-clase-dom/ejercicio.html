<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 03 — Formulario + Clase + DOM</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f4f6f8; color: #222; margin: 0; }
    .contenedor { max-width: 960px; margin: 0 auto; }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
    .panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); margin-bottom: 16px; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 5px; font-weight: bold; font-size: 14px; }
    input, select, textarea { padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; font-family: inherit; }
    textarea { resize: vertical; min-height: 60px; }
    button { padding: 10px 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-principal  { background: #2563eb; color: white; }
    .btn-completar  { background: #0f766e; color: white; font-size: 12px; padding: 6px 10px; }
    .btn-eliminar   { background: #dc2626; color: white; font-size: 12px; padding: 6px 10px; }
    .zona { display: grid; gap: 12px; }
    .tarea { border: 2px solid #d1d5db; border-radius: 12px; padding: 14px; background: white; }
    .tarea.completada { background: #ecfdf5; border-color: #22c55e; opacity: 0.8; }
    .cabecera { display: flex; justify-content: space-between; align-items: flex-start; }
    .tarea h3 { margin: 0 0 6px; }
    .tarea p  { margin: 4px 0; font-size: 13px; color: #475569; }
    .acciones { display: flex; gap: 8px; margin-top: 10px; }
    .etiqueta { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: bold; }
    .prioridad-alta  { background: #fee2e2; color: #991b1b; }
    .prioridad-media { background: #fef3c7; color: #92400e; }
    .prioridad-baja  { background: #dcfce7; color: #166534; }
    .muted { color: #64748b; font-style: italic; }
    .resumen-val { font-size: 24px; font-weight: bold; }
  </style>
</head>
<body>
<div class="contenedor">
  <h1>Ejercicio 03 — Formulario + Clase + DOM</h1>
  <div class="grid">
    <div>
      <section class="panel">
        <h2>Nueva tarea</h2>
        <form id="formTarea" autocomplete="off">
          <label>Texto de la tarea
            <input id="inpTexto" type="text" placeholder="Ej: Estudiar DOM" required>
          </label>
          <label>Prioridad
            <select id="selPrioridad">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
          </label>
          <button type="submit" class="btn-principal">Añadir tarea</button>
        </form>
      </section>
      <section class="panel">
        <h2>Resumen</h2>
        <p>Total: <span class="resumen-val" id="totalTareas">0</span></p>
        <p>Pendientes: <span class="resumen-val" id="tareasPendientes">0</span></p>
        <p>Completadas: <span class="resumen-val" id="tareasCompletadas">0</span></p>
      </section>
    </div>
    <section class="panel">
      <h2>Lista de tareas</h2>
      <p class="muted" id="mensajeVacio">No hay tareas todavía.</p>
      <div id="listaTareas" class="zona"></div>
    </section>
  </div>
</div>

<script>
  // ===================================================
  // TODO 1: Implementa la clase Tarea con campos privados (CORREGIDO)
  // ===================================================
  class Tarea {
    #id;
    #texto;
    #prioridad;
    #completada;

    constructor(id, texto, prioridad) {
      this.#id = id;
      this.#texto = texto;
      this.#prioridad = prioridad;
      this.#completada = false; // Inicialización crucial
    }

    getId() { return this.#id; }
    getTexto() { return this.#texto; }
    getPrioridad() { return this.#prioridad; }
    getCompletada() { return this.#completada; }

    setCompletada(v) { this.#completada = Boolean(v); }
    toggleCompletar() { this.#completada = !this.#completada; }
  }

  // ===================================================
  // Referencias al DOM
  // ===================================================
  const formTarea        = document.getElementById("formTarea");
  const inpTexto         = document.getElementById("inpTexto");
  const selPrioridad     = document.getElementById("selPrioridad");
  const listaTareas      = document.getElementById("listaTareas");
  const mensajeVacio     = document.getElementById("mensajeVacio");
  const totalTareas      = document.getElementById("totalTareas");
  const tareasPendientes = document.getElementById("tareasPendientes");
  const tareasCompletadas= document.getElementById("tareasCompletadas");

  let siguienteId = 1;

  // ===================================================
  // TODO 2: Implementa crearTarjetaTarea(tarea) (CORREGIDO)
  // ===================================================
  function crearTarjetaTarea(tarea) {
    const tarjeta = document.createElement("article");
    tarjeta.classList.add("tarea"); // ¡Faltaba añadir la clase base al article!

    tarjeta.dataset.id = tarea.getId();
    tarjeta.dataset.texto = tarea.getTexto();
    tarjeta.dataset.prioridad = tarea.getPrioridad();
    tarjeta.dataset.completada = tarea.getCompletada();

    const titulo = document.createElement("h3");
    titulo.textContent = tarea.getTexto(); // Corregido 'terea'

    const etiqueta = document.createElement("span");
    etiqueta.classList.add("etiqueta", "prioridad-" + tarea.getPrioridad());
    etiqueta.textContent = tarea.getPrioridad().charAt(0).toUpperCase() + tarea.getPrioridad().slice(1);

    const acciones = document.createElement("div");
    acciones.classList.add("acciones");

    const btnCompletar = document.createElement("button");
    btnCompletar.dataset.accion = "completar";
    btnCompletar.classList.add("btn-completar"); // Corregido: comillas añadidas
    btnCompletar.textContent = "✓ Completar";

    const btnEliminar = document.createElement("button");
    btnEliminar.classList.add("btn-eliminar");
    btnEliminar.dataset.accion = "eliminar";
    btnEliminar.textContent = "✕ Eliminar";

    acciones.appendChild(btnCompletar);
    acciones.appendChild(btnEliminar);
    tarjeta.appendChild(titulo);
    tarjeta.appendChild(etiqueta);
    tarjeta.appendChild(acciones);

    return tarjeta;
  }

  // ===================================================
  // TODO 3: Implementa actualizarResumen() (CORREGIDO)
  // ===================================================
  function actualizarResumen() {
    // Corregido el selector de ".tareas" a ".tarea"
    const tarjetas = document.querySelectorAll(".tarea");
    let completadas = 0;
    
    tarjetas.forEach(tarjeta => {
      if (tarjeta.dataset.completada === "true") completadas++;
    });
    
    const total = tarjetas.length;
    const pendientes = total - completadas;

    totalTareas.textContent       = total;
    tareasPendientes.textContent = pendientes;
    tareasCompletadas.textContent= completadas;
    mensajeVacio.style.display   = total === 0 ? "block" : "none";
  }

  // ===================================================
  // TODO 4: Listener del formulario (CORREGIDO)
  // ===================================================
  formTarea.addEventListener("submit", function(event) {
    event.preventDefault(); 

    const texto     = inpTexto.value;
    const prioridad = selPrioridad.value;

    const tarea = new Tarea(siguienteId, texto, prioridad);
    const tarjeta = crearTarjetaTarea(tarea); // Corregido 'terea'

    listaTareas.appendChild(tarjeta);
    siguienteId++;

    // Limpiar formulario
    formTarea.reset();
    selPrioridad.value = "media";
    inpTexto.focus();

    actualizarResumen();
  });

  // ===================================================
  // TODO 5: Delegación de eventos en listaTareas (CORREGIDO)
  // ===================================================
  listaTareas.addEventListener("click", function(event) {
    const tarjeta = event.target.closest(".tarea");
    if (!tarjeta) return;

    const accion = event.target.dataset.accion;
    if (!accion) return;

    event.stopPropagation();

    if (accion === "completar") {
      const estaCompleta = tarjeta.dataset.completada === "true";
      // Guardamos el nuevo estado inverso en el dataset como string
      tarjeta.dataset.completada = !estaCompleta;
      tarjeta.classList.toggle("completada");
      
      // Si antes estaba completa (true), ahora pasa a estar pendiente de hacer
      event.target.textContent = estaCompleta ? "✓ Completar" : "↩ Deshacer";
    }

    if (accion === "eliminar") {
      listaTareas.removeChild(tarjeta);
    }

    actualizarResumen();
  });

  // Estado inicial
  actualizarResumen();
</script>
</body>
</html>
