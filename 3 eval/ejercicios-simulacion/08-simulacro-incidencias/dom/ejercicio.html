<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulacro 08 — Gestor de incidencias de soporte</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 30px; background: #f4f6f8; color: #222; }
    .contenedor { max-width: 1200px; margin: 0 auto; }
    h1, h2, h3 { margin-top: 0; }
    .grid-principal { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    .panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); margin-bottom: 20px; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-weight: bold; }
    input, select, textarea, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; font-family: inherit; }
    textarea { resize: vertical; min-height: 70px; }
    button { border: none; background: #2563eb; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .btn-secundario { background: #475569; }
    .btn-secundario:hover { background: #334155; }
    .btn-avanzar { background: #0f766e; }
    .btn-avanzar:hover { background: #0d5f59; }
    .btn-cerrar, .btn-eliminar { background: #dc2626; }
    .btn-cerrar:hover, .btn-eliminar:hover { background: #b91c1c; }
    .btn-editar { background: #9333ea; }
    .btn-editar:hover { background: #7e22ce; }
    .resumen { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .dato-resumen { background: #f8fafc; border: 1px solid #dbe4ee; border-radius: 10px; padding: 12px; }
    .dato-resumen strong { display: block; font-size: 22px; margin-bottom: 4px; }
    .zona-incidencias { display: grid; gap: 14px; }
    .incidencia { border: 2px solid #d1d5db; border-radius: 14px; padding: 16px; background: white; cursor: pointer; transition: 0.2s; }
    .incidencia:hover { border-color: #2563eb; }
    .incidencia.seleccionada { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,0.15); }
    .incidencia-en_progreso { background: #fff7ed; border-color: #f97316; }
    .incidencia-resuelta    { background: #ecfdf5; border-color: #22c55e; }
    .incidencia-cerrada     { background: #f1f5f9; border-color: #94a3b8; opacity: 0.75; }
    .cabecera-inc { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .cabecera-inc h3 { margin-bottom: 4px; }
    .etiquetas { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .etiqueta { display: inline-block; padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: bold; }
    .estado-abierta     { background: #e0f2fe; color: #075985; }
    .estado-en_progreso { background: #ffedd5; color: #9a3412; }
    .estado-resuelta    { background: #dcfce7; color: #166534; }
    .estado-cerrada     { background: #e2e8f0; color: #475569; }
    .tipo-software  { background: #dbeafe; color: #1e40af; }
    .tipo-hardware  { background: #fee2e2; color: #991b1b; }
    .tipo-red       { background: #fef3c7; color: #92400e; }
    .tipo-usuario   { background: #ede9fe; color: #4c1d95; }
    .prioridad-baja    { background: #dcfce7; color: #166534; }
    .prioridad-media   { background: #fef3c7; color: #92400e; }
    .prioridad-alta    { background: #ffedd5; color: #9a3412; }
    .prioridad-critica { background: #fee2e2; color: #991b1b; font-weight: 900; }
    .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .acciones button { padding: 8px 10px; font-size: 13px; }
    .linea-info { margin: 6px 0; }
    .muted { color: #64748b; font-style: italic; }
    .fila-botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  </style>
</head>

    <h1>Simulacro 08 — Gestor de incidencias de soporte</h1>
    <p style="color:#64748b">⏱ Tiempo estimado para esta parte: <strong>70 minutos</strong></p>

          <form id="formIncidencia" autocomplete="off">

              <input id="inpTitulo" type="text" placeholder="Ej: Error al iniciar sesión" required>
            </label>
            <label>Tipo
              <select id="selTipo" required>
                <option value="software">Software</option>
                <option value="hardware">Hardware</option>
                <option value="red" selected>Red</option>
                <option value="usuario">Usuario</option>
              </select>
            </label>
            <label>Prioridad
              <select id="selPrioridad" required>
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
                <option value="critica">Crítica</option>
              </select>
            </label>
            <label>Técnico asignado
              <input id="inpTecnico" type="text" placeholder="Ej: Carlos R." required>
            </label>
            <label>Descripción
              <textarea id="txtDescripcion" placeholder="Describe el problema..."></textarea>
            </label>
            <button type="submit">Registrar incidencia</button>
          </form>
        </section>

        <section class="panel">
          <h2>Resumen</h2>
          <div class="resumen">
            <div class="dato-resumen"><strong id="totalIncidencias">0</strong>Total</div>
            <div class="dato-resumen"><strong id="totalActivas">0</strong>Activas</div>
            <div class="dato-resumen"><strong id="totalResueltas">0</strong>Resueltas / Cerradas</div>
            <div class="dato-resumen"><strong id="totalCriticas">0</strong>Críticas sin resolver</div>
          </div>
          <div class="fila-botones">
            <button id="btnLimpiarCerradas" type="button" class="btn-secundario">Eliminar cerradas</button>
          </div>
        </section>
      </div>

      <div>
        <section class="panel">
          <h2>Incidencias</h2>
          <p class="muted" id="mensajeVacio">No hay incidencias registradas.</p>
          <div id="listaIncidencias" class="zona-incidencias"></div>
        </section>
      </div>
    </div>
  </div>
