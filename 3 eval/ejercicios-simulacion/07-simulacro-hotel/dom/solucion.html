<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solución 07 — Gestor de reservas de hotel</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 30px; background: #f4f6f8; color: #222; }
    .contenedor { max-width: 1200px; margin: 0 auto; }
    h1, h2, h3 { margin-top: 0; }
    .aviso { background: #fffbeb; border: 2px solid #f59e0b; border-radius: 8px; padding: 10px 16px; margin-bottom: 20px; font-size: 13px; }
    .grid-principal { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    .panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); margin-bottom: 20px; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-weight: bold; }
    input, select, textarea, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; font-family: inherit; }
    textarea { resize: vertical; min-height: 60px; }
    button { border: none; background: #2563eb; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .btn-secundario { background: #475569; }
    .btn-secundario:hover { background: #334155; }
    .btn-confirmar { background: #0f766e; }
    .btn-confirmar:hover { background: #0d5f59; }
    .btn-cancelar, .btn-eliminar { background: #dc2626; }
    .btn-cancelar:hover, .btn-eliminar:hover { background: #b91c1c; }
    .btn-editar { background: #9333ea; }
    .btn-editar:hover { background: #7e22ce; }
    .resumen { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .dato-resumen { background: #f8fafc; border: 1px solid #dbe4ee; border-radius: 10px; padding: 12px; }
    .dato-resumen strong { display: block; font-size: 22px; margin-bottom: 4px; }
    .zona-reservas { display: grid; gap: 14px; }
    .reserva { border: 2px solid #d1d5db; border-radius: 14px; padding: 16px; background: white; cursor: pointer; transition: 0.2s; }
    .reserva:hover { border-color: #2563eb; }
    .reserva.seleccionada { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,0.15); }
    .reserva-confirmada { background: #eff6ff; border-color: #3b82f6; }
    .reserva-checkin    { background: #ecfdf5; border-color: #22c55e; }
    .reserva-cancelada  { background: #fef2f2; border-color: #ef4444; opacity: 0.8; }
    .cabecera-reserva { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .cabecera-reserva h3 { margin-bottom: 4px; }
    .etiquetas { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .etiqueta { display: inline-block; padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: bold; }
    .estado-pendiente  { background: #e0f2fe; color: #075985; }
    .estado-confirmada { background: #dbeafe; color: #1e40af; }
    .estado-checkin    { background: #dcfce7; color: #166534; }
    .estado-cancelada  { background: #fee2e2; color: #991b1b; }
    .tipo-individual { background: #e5e7eb; color: #374151; }
    .tipo-doble      { background: #ede9fe; color: #4c1d95; }
    .tipo-suite      { background: #fef3c7; color: #92400e; }
    .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .acciones button { padding: 8px 10px; font-size: 13px; }
    .linea-info { margin: 6px 0; }
    .muted { color: #64748b; font-style: italic; }
    .fila-botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="aviso">⚠️ Intenta resolver el ejercicio antes de consultar esta solución.</div>
    <h1>Gestor de reservas de hotel — SOLUCIÓN</h1>
    <div class="grid-principal">
      <div>
        <section class="panel">
          <h2>Nueva reserva</h2>
          <form id="formReserva" autocomplete="off">
            <label>Nombre del huésped
              <input id="inpHuesped" type="text" placeholder="Ej: María López" required>
            </label>
            <label>Tipo de habitación
              <select id="selTipo" required>
                <option value="individual" data-precio="89">Individual — 89 €/noche</option>
                <option value="doble"      data-precio="129" selected>Doble — 129 €/noche</option>
                <option value="suite"      data-precio="249">Suite — 249 €/noche</option>
              </select>
            </label>
            <label>Número de noches
              <input id="inpNoches" type="number" min="1" max="30" value="1" required>
            </label>
            <label>Observaciones
              <textarea id="txtObservaciones" placeholder="Ej: cama extra, llegada tardía..."></textarea>
            </label>
            <button type="submit">Añadir reserva</button>
          </form>
        </section>
        <section class="panel">
          <h2>Resumen</h2>
          <div class="resumen">
            <div class="dato-resumen"><strong id="totalReservas">0</strong>Total reservas</div>
            <div class="dato-resumen"><strong id="totalActivas">0</strong>Activas</div>
            <div class="dato-resumen"><strong id="totalCanceladas">0</strong>Canceladas</div>
            <div class="dato-resumen"><strong id="ingresosEstimados">0.00 €</strong>Ingresos estimados</div>
          </div>
          <div class="fila-botones">
            <button id="btnLimpiarCanceladas" type="button" class="btn-secundario">Eliminar canceladas</button>
          </div>
        </section>
      </div>
      <div>
        <section class="panel">
          <h2>Reservas</h2>
          <p class="muted" id="mensajeVacio">No hay reservas registradas todavía.</p>
          <div id="listaReservas" class="zona-reservas"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    class Reserva {
      #id; #huesped; #tipoHabitacion; #precioNoche; #noches; #estado; #observaciones;
      constructor(id, huesped, tipoHabitacion, precioNoche, noches, observaciones) {
        this.#id = id;
        this.setHuesped(huesped); this.setTipoHabitacion(tipoHabitacion);
        this.setPrecioNoche(precioNoche); this.setNoches(noches);
        this.setObservaciones(observaciones); this.#estado = "pendiente";
      }
      getId()             { return this.#id; }
      getHuesped()        { return this.#huesped; }
      getTipoHabitacion() { return this.#tipoHabitacion; }
      getPrecioNoche()    { return this.#precioNoche; }
      getNoches()         { return this.#noches; }
      getEstado()         { return this.#estado; }
      getObservaciones()  { return this.#observaciones; }
      setHuesped(h)        { this.#huesped = String(h).trim(); }
      setTipoHabitacion(t) { this.#tipoHabitacion = t; }
      setPrecioNoche(p)    { this.#precioNoche = Number(p); }
      setNoches(n)         { this.#noches = Number(n); }
      setEstado(e)         { this.#estado = e; }
      setObservaciones(obs){ const t=String(obs).trim(); this.#observaciones = t===""?"Sin observaciones":t; }
      getImporteTotal()    { return this.#precioNoche * this.#noches; }
    }

    const formReserva       = document.getElementById("formReserva");
    const inpHuesped        = document.getElementById("inpHuesped");
    const selTipo           = document.getElementById("selTipo");
    const inpNoches         = document.getElementById("inpNoches");
    const txtObservaciones  = document.getElementById("txtObservaciones");
    const listaReservas     = document.getElementById("listaReservas");
    const mensajeVacio      = document.getElementById("mensajeVacio");
    const totalReservas     = document.getElementById("totalReservas");
    const totalActivas      = document.getElementById("totalActivas");
    const totalCanceladas   = document.getElementById("totalCanceladas");
    const ingresosEstimados = document.getElementById("ingresosEstimados");
    const btnLimpiarCanceladas = document.getElementById("btnLimpiarCanceladas");
    let siguienteId = 1;

    function formatearEuros(n)  { return Number(n).toFixed(2) + " €"; }
    function nombreEstado(e)    { return {pendiente:"Pendiente",confirmada:"Confirmada",checkin:"Check-in",cancelada:"Cancelada"}[e]||e; }
    function siguienteEstado(e) { return {pendiente:"confirmada",confirmada:"checkin",checkin:"pendiente"}[e]||"pendiente"; }
    function nombreTipo(t)      { return {individual:"Individual",doble:"Doble",suite:"Suite"}[t]||t; }

    // TODO 1 resuelto
    function obtenerPrecioSeleccionado() {
      return Number(selTipo.options[selTipo.selectedIndex].dataset.precio);
    }

    function crearBoton(texto, accion, clase) {
      const btn = document.createElement("button");
      btn.textContent = texto; btn.dataset.accion = accion; btn.classList.add(clase);
      return btn;
    }

    // TODOs 2-6 resueltos
    function crearTarjetaReserva(reserva) {
      const article = document.createElement("article");
      article.classList.add("reserva");
      article.dataset.id           = reserva.getId();
      article.dataset.huesped      = reserva.getHuesped();
      article.dataset.tipo         = reserva.getTipoHabitacion();
      article.dataset.precio       = reserva.getPrecioNoche();
      article.dataset.noches       = reserva.getNoches();
      article.dataset.estado       = reserva.getEstado();
      article.dataset.observaciones= reserva.getObservaciones();

      const cab = document.createElement("div"); cab.classList.add("cabecera-reserva");
      const infoDiv = document.createElement("div");
      const h3 = document.createElement("h3");
      h3.textContent = `Reserva #${reserva.getId()} — ${reserva.getHuesped()}`;
      const pInfo = document.createElement("p"); pInfo.classList.add("linea-info");
      pInfo.textContent = `${nombreTipo(reserva.getTipoHabitacion())} · ${formatearEuros(reserva.getPrecioNoche())}/noche · ${reserva.getNoches()} noche(s)`;
      infoDiv.appendChild(h3); infoDiv.appendChild(pInfo); cab.appendChild(infoDiv);

      const etiquetas = document.createElement("div"); etiquetas.classList.add("etiquetas");
      const spanEstado = document.createElement("span");
      spanEstado.classList.add("etiqueta","estado-"+reserva.getEstado());
      spanEstado.textContent = nombreEstado(reserva.getEstado());
      const spanTipo = document.createElement("span");
      spanTipo.classList.add("etiqueta","tipo-"+reserva.getTipoHabitacion());
      spanTipo.textContent = nombreTipo(reserva.getTipoHabitacion());
      const spanImporte = document.createElement("span");
      spanImporte.classList.add("etiqueta"); spanImporte.textContent = formatearEuros(reserva.getImporteTotal());
      etiquetas.appendChild(spanEstado); etiquetas.appendChild(spanTipo); etiquetas.appendChild(spanImporte);

      const pObs = document.createElement("p"); pObs.classList.add("linea-info","muted");
      pObs.textContent = reserva.getObservaciones();

      const acciones = document.createElement("div"); acciones.classList.add("acciones");
      acciones.appendChild(crearBoton("▶ Avanzar estado","cambiar-estado","btn-confirmar"));
      acciones.appendChild(crearBoton("✏ Editar obs.","editar","btn-editar"));
      acciones.appendChild(crearBoton("✕ Cancelar","cancelar","btn-cancelar"));
      acciones.appendChild(crearBoton("🗑 Eliminar","eliminar","btn-eliminar"));

      article.appendChild(cab); article.appendChild(etiquetas);
      article.appendChild(pObs); article.appendChild(acciones);
      aplicarClaseEstado(article);
      return article;
    }

    // TODO 7 resuelto
    function aplicarClaseEstado(tarjeta) {
      tarjeta.classList.remove("reserva-confirmada","reserva-checkin","reserva-cancelada");
      const e = tarjeta.dataset.estado;
      if (e === "confirmada") tarjeta.classList.add("reserva-confirmada");
      if (e === "checkin")    tarjeta.classList.add("reserva-checkin");
      if (e === "cancelada")  tarjeta.classList.add("reserva-cancelada");
    }

    // TODO 8 resuelto
    function actualizarTarjetaTrasCambio(tarjeta) {
      const estado = tarjeta.dataset.estado;
      const spanE  = tarjeta.querySelector(".etiqueta[class*='estado-']");
      if (spanE) { spanE.className = "etiqueta estado-"+estado; spanE.textContent = nombreEstado(estado); }
      const pObs = tarjeta.querySelector(".muted");
      if (pObs) pObs.textContent = tarjeta.dataset.observaciones;
      aplicarClaseEstado(tarjeta);
    }

    // TODO 9 resuelto
    function actualizarResumen() {
      const tarjetas = listaReservas.querySelectorAll(".reserva");
      let activas = 0, canceladas = 0, ingresos = 0;
      tarjetas.forEach(t => {
        if (t.dataset.estado === "cancelada") { canceladas++; }
        else { activas++; ingresos += Number(t.dataset.precio) * Number(t.dataset.noches); }
      });
      totalReservas.textContent     = tarjetas.length;
      totalActivas.textContent      = activas;
      totalCanceladas.textContent   = canceladas;
      ingresosEstimados.textContent = formatearEuros(ingresos);
      mensajeVacio.style.display    = tarjetas.length === 0 ? "block" : "none";
    }

    // TODO 10 resuelto
    function seleccionarReserva(tarjeta) {
      listaReservas.querySelectorAll(".reserva").forEach(r => r.classList.remove("seleccionada"));
      tarjeta.classList.add("seleccionada");
    }

    // TODO 11 resuelto
    function cambiarEstadoReserva(tarjeta) {
      if (tarjeta.dataset.estado === "cancelada") return;
      tarjeta.dataset.estado = siguienteEstado(tarjeta.dataset.estado);
      actualizarTarjetaTrasCambio(tarjeta);
      actualizarResumen();
    }

    // TODO 12 resuelto
    function editarObservaciones(tarjeta) {
      const nuevo = prompt("Editar observaciones:", tarjeta.dataset.observaciones);
      if (nuevo === null) return;
      tarjeta.dataset.observaciones = nuevo.trim() === "" ? "Sin observaciones" : nuevo.trim();
      actualizarTarjetaTrasCambio(tarjeta);
    }

    // TODO 13 resuelto
    function cancelarReserva(tarjeta) {
      tarjeta.dataset.estado = "cancelada";
      actualizarTarjetaTrasCambio(tarjeta);
      actualizarResumen();
    }

    // TODO 14 resuelto
    function eliminarReserva(tarjeta) {
      listaReservas.removeChild(tarjeta);
      actualizarResumen();
    }

    // TODOs 15-18 resueltos
    formReserva.addEventListener("submit", function(event) {
      event.preventDefault();
      const huesped      = inpHuesped.value;
      const tipo         = selTipo.value;
      const precio       = obtenerPrecioSeleccionado();
      const noches       = inpNoches.value;
      const observaciones= txtObservaciones.value;

      const reserva = new Reserva(siguienteId, huesped, tipo, precio, noches, observaciones);
      listaReservas.appendChild(crearTarjetaReserva(reserva));
      siguienteId++;
      formReserva.reset();
      inpNoches.value = 1;
      inpHuesped.focus();
      actualizarResumen();
    });

    // TODO 19 resuelto
    listaReservas.addEventListener("click", function(event) {
      const tarjeta = event.target.closest(".reserva");
      if (!tarjeta) return;
      const accion = event.target.dataset.accion;
      if (accion) {
        event.stopPropagation();
        if (accion === "cambiar-estado") cambiarEstadoReserva(tarjeta);
        if (accion === "editar")         editarObservaciones(tarjeta);
        if (accion === "cancelar")       cancelarReserva(tarjeta);
        if (accion === "eliminar")       eliminarReserva(tarjeta);
        return;
      }
      seleccionarReserva(tarjeta);
    });

    // TODO 20 resuelto
    btnLimpiarCanceladas.addEventListener("click", function() {
      listaReservas.querySelectorAll(".reserva[data-estado='cancelada']")
        .forEach(r => listaReservas.removeChild(r));
      actualizarResumen();
    });

    actualizarResumen();
  </script>
</body>
</html>
