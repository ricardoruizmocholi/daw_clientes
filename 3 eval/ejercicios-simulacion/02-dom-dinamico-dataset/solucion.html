<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Solución 02 — DOM dinámico</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f4f6f8; color: #222; }
    .panel { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); max-width: 750px; margin: 0 auto; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    .solucion { background: #fffbeb; border: 2px solid #f59e0b; border-radius: 8px; padding: 10px 16px; margin-bottom: 20px; font-size: 13px; }
    .zona { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 20px; }
    .empleado { border: 2px solid #cbd5e1; border-radius: 12px; padding: 16px; background: white; }
    .empleado h3 { margin: 0 0 6px; font-size: 1rem; }
    .empleado p  { margin: 4px 0; font-size: 13px; color: #475569; }
    .empleado .salario { font-weight: bold; color: #1e293b; }
    .activo   { border-color: #22c55e; background: #f0fdf4; }
    .inactivo { border-color: #ef4444; background: #fef2f2; opacity: 0.75; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: bold; margin-top: 8px; }
    .badge-activo   { background: #dcfce7; color: #166534; }
    .badge-inactivo { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
<div class="panel">
  <h1>Solución 02 — DOM dinámico y data-*</h1>
  <div class="solucion">⚠️ Intenta resolver el ejercicio antes de consultar esta solución.</div>
  <div id="listaEmpleados" class="zona"></div>
</div>

<script>
  const empleados = [
    { id: 1, nombre: "Ana García",    departamento: "Desarrollo",  salario: 2800, activo: true  },
    { id: 2, nombre: "Luis Martínez", departamento: "Marketing",   salario: 2200, activo: true  },
    { id: 3, nombre: "Marta López",   departamento: "Diseño",      salario: 2500, activo: false },
    { id: 4, nombre: "Carlos Ruiz",   departamento: "Soporte",     salario: 1900, activo: true  },
    { id: 5, nombre: "Elena Torres",  departamento: "Ventas",      salario: 2100, activo: false }
  ];

  const listaEmpleados = document.getElementById("listaEmpleados");

  // SOLUCIÓN: recorre el array y crea una tarjeta por empleado
  empleados.forEach(function(emp) {
    // Paso 1: crear el article
    const tarjeta = document.createElement("article");

    // Paso 2: clases CSS (empleado + activo/inactivo)
    tarjeta.classList.add("empleado");
    tarjeta.classList.add(emp.activo ? "activo" : "inactivo");

    // Paso 3: guardar estado en data-*
    // Clave: los datos viven en el DOM, no en variables sueltas
    tarjeta.dataset.id           = emp.id;
    tarjeta.dataset.nombre       = emp.nombre;
    tarjeta.dataset.departamento = emp.departamento;
    tarjeta.dataset.salario      = emp.salario;
    tarjeta.dataset.activo       = emp.activo;

    // Paso 4: construir contenido interno
    const titulo = document.createElement("h3");
    titulo.textContent = emp.nombre;

    const dpto = document.createElement("p");
    dpto.textContent = emp.departamento;

    const salario = document.createElement("p");
    salario.classList.add("salario");
    salario.textContent = Number(emp.salario).toFixed(2) + " €/mes";

    const badge = document.createElement("span");
    badge.classList.add("badge");
    badge.classList.add(emp.activo ? "badge-activo" : "badge-inactivo");
    badge.textContent = emp.activo ? "Activo" : "Inactivo";

    // Paso 5: montar la tarjeta
    tarjeta.appendChild(titulo);
    tarjeta.appendChild(dpto);
    tarjeta.appendChild(salario);
    tarjeta.appendChild(badge);

    // Paso 6: insertar en el contenedor
    listaEmpleados.appendChild(tarjeta);
  });
</script>
</body>
</html>
