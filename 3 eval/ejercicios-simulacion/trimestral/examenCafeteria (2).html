<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de pedidos de cafetería</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background-color: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .grid-principal {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background-color: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea,
    button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    button {
      border: none;
      background-color: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .btn-secundario {
      background-color: #475569;
    }

    .btn-secundario:hover {
      background-color: #334155;
    }

    .btn-preparar {
      background-color: #0f766e;
    }

    .btn-preparar:hover {
      background-color: #0d5f59;
    }

    .btn-cancelar,
    .btn-eliminar {
      background-color: #dc2626;
    }

    .btn-cancelar:hover,
    .btn-eliminar:hover {
      background-color: #b91c1c;
    }

    .btn-editar {
      background-color: #9333ea;
    }

    .btn-editar:hover {
      background-color: #7e22ce;
    }

    .resumen {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .dato-resumen {
      background-color: #f8fafc;
      border: 1px solid #dbe4ee;
      border-radius: 10px;
      padding: 12px;
    }

    .dato-resumen strong {
      display: block;
      font-size: 22px;
      margin-bottom: 4px;
    }

    .zona-pedidos {
      display: grid;
      gap: 14px;
    }

    .pedido {
      border: 2px solid #d1d5db;
      border-radius: 14px;
      padding: 16px;
      background-color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .pedido:hover {
      border-color: #2563eb;
    }

    .pedido.seleccionado {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.16);
    }

    .pedido-preparando {
      background-color: #fff7ed;
      border-color: #fb923c;
    }

    .pedido-preparado {
      background-color: #ecfdf5;
      border-color: #22c55e;
    }

    .pedido-cancelado {
      background-color: #fef2f2;
      border-color: #ef4444;
      opacity: 0.85;
    }

    .cabecera-pedido {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .cabecera-pedido h3 {
      margin-bottom: 4px;
    }

    .etiquetas {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0;
    }

    .etiqueta {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      background-color: #e5e7eb;
      color: #374151;
    }

    .etiqueta.estado-pendiente {
      background-color: #e0f2fe;
      color: #075985;
    }

    .etiqueta.estado-preparando {
      background-color: #ffedd5;
      color: #9a3412;
    }

    .etiqueta.estado-preparado {
      background-color: #dcfce7;
      color: #166534;
    }

    .etiqueta.estado-cancelado {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .prioridad-alta {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .prioridad-media {
      background-color: #fef3c7;
      color: #92400e;
    }

    .prioridad-baja {
      background-color: #dcfce7;
      color: #166534;
    }

    .acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .acciones button {
      padding: 8px 10px;
      font-size: 13px;
    }

    .linea-info {
      margin: 6px 0;
    }

    .muted {
      color: #64748b;
      font-style: italic;
    }

    .fila-botones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    code {
      background-color: #eef2f7;
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>Gestor de pedidos de cafetería</h1>

    <div class="grid-principal">
      <div>
        <section class="panel">
          <h2>Nuevo pedido</h2>

          <form id="formPedido" autocomplete="off">
            <label>
              Cliente
              <input id="inpCliente" type="text" placeholder="Ej: Ana" required>
            </label>

            <label>
              Producto
              <select id="selProducto" required>
                <option value="Café" data-precio="1.30">Café - 1.30 €</option>
                <option value="Cortado" data-precio="1.40">Cortado - 1.40 €</option>
                <option value="Tostada" data-precio="2.20">Tostada - 2.20 €</option>
                <option value="Bocadillo" data-precio="4.50">Bocadillo - 4.50 €</option>
                <option value="Zumo" data-precio="2.10">Zumo - 2.10 €</option>
              </select>
            </label>

            <label>
              Cantidad
              <input id="inpCantidad" type="number" min="1" max="20" value="1" required>
            </label>

            <label>
              Prioridad
              <select id="selPrioridad" required>
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
              </select>
            </label>

            <label>
              Observaciones
              <textarea id="txtObservaciones" placeholder="Ej: sin azúcar, para llevar..."></textarea>
            </label>

            <button type="submit">Añadir pedido</button>
          </form>
        </section>

        <section class="panel">
          <h2>Resumen</h2>

          <div class="resumen">
            <div class="dato-resumen">
              <strong id="totalPedidos">0</strong>
              Total pedidos
            </div>
            <div class="dato-resumen">
              <strong id="totalPreparados">0</strong>
              Preparados
            </div>
            <div class="dato-resumen">
              <strong id="totalPendientes">0</strong>
              Pendientes
            </div>
            <div class="dato-resumen">
              <strong id="importeTotal">0.00 €</strong>
              Importe activo
            </div>
          </div>

          <div class="fila-botones">
            <button id="btnLimpiarPreparados" type="button" class="btn-secundario">Eliminar preparados/cancelados</button>
          </div>
        </section>
      </div>

      <div>
        <section class="panel">
          <h2>Pedidos</h2>
          <p class="muted" id="mensajeVacio">Todavía no hay pedidos registrados.</p>
          <div id="listaPedidos" class="zona-pedidos"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    // =====================================================
    // Clase Pedido
    // =====================================================
    // =====================================================
  // Clase Pedido
  // =====================================================
  class Pedido {
    #id;
    #cliente;
    #producto;
    #precioUnitario;
    #cantidad;
    #prioridad;
    #observaciones;
    #estado;

    constructor(id, cliente, producto, precioUnitario, cantidad, prioridad, observaciones) {
      this.#id = id;
      this.setCliente(cliente);
      this.setProducto(producto);
      this.setPrecioUnitario(precioUnitario);
      this.setCantidad(cantidad);
      this.setPrioridad(prioridad);
      this.setObservaciones(observaciones);
      this.#estado = "pendiente";
    }

    getId() { return this.#id; }
    getCliente() { return this.#cliente; }
    getProducto() { return this.#producto; }
    getPrecioUnitario() { return this.#precioUnitario; }
    getCantidad() { return this.#cantidad; }
    getPrioridad() { return this.#prioridad; }
    getObservaciones() { return this.#observaciones; }
    getEstado() { return this.#estado; }

    setCliente(cliente) {
      this.#cliente = cliente.trim();
    }

    setProducto(producto) {
      this.#producto = producto;
    }

    setPrecioUnitario(precioUnitario) {
      this.#precioUnitario = Number(precioUnitario);
    }

    setCantidad(cantidad) {
      this.#cantidad = Number(cantidad);
    }

    setPrioridad(prioridad) {
      this.#prioridad = prioridad;
    }

    setObservaciones(observaciones) {
      const texto = observaciones.trim();
      this.#observaciones = texto === "" ? "Sin observaciones" : texto;
    }

    setEstado(estado) {
      this.#estado = estado;
    }

    getImporte() {
      return this.#precioUnitario * this.#cantidad;
    }
  }

  // =====================================================
  // Referencias al DOM
  // =====================================================
  const formPedido = document.getElementById("formPedido");
  const inpCliente = document.getElementById("inpCliente");
  const selProducto = document.getElementById("selProducto");
  const inpCantidad = document.getElementById("inpCantidad");
  const selPrioridad = document.getElementById("selPrioridad");
  const txtObservaciones = document.getElementById("txtObservaciones");

  const listaPedidos = document.getElementById("listaPedidos");
  const mensajeVacio = document.getElementById("mensajeVacio");

  const totalPedidos = document.getElementById("totalPedidos");
  const totalPreparados = document.getElementById("totalPreparados");
  const totalPendientes = document.getElementById("totalPendientes");
  const importeTotal = document.getElementById("importeTotal");

  const btnLimpiarPreparados = document.getElementById("btnLimpiarPreparados");

  // =====================================================
  // Estado de la aplicación
  // =====================================================
  let siguienteId = 1;

  // =====================================================
  // Funciones auxiliares
  // =====================================================

  function formatearEuros(numero) {
    return Number(numero).toFixed(2) + " €";
  }

  // TODO 1: Obtener precio seleccionado
  function obtenerPrecioSeleccionado() {
    const opcionSeleccionada = selProducto.options[selProducto.selectedIndex];
    return Number(opcionSeleccionada.dataset.precio);
  }

  function nombreEstado(estado) {
    if (estado === "pendiente") return "Pendiente";
    if (estado === "preparando") return "Preparando";
    if (estado === "preparado") return "Preparado";
    if (estado === "cancelado") return "Cancelado";
    return estado;
  }

  function siguienteEstado(estadoActual) {
    if (estadoActual === "pendiente") return "preparando";
    if (estadoActual === "preparando") return "preparado";
    if (estadoActual === "preparado") return "pendiente";
    return "pendiente";
  }

  // =====================================================
  // Creación dinámica de tarjetas
  // =====================================================
  function crearTarjetaPedido(pedido) {
    const idActual = pedido.getId();

    // TODO 2: Crear el elemento principal con datasets
    const tarjeta = document.createElement("article");
    tarjeta.classList.add("pedido");

    tarjeta.dataset.id = idActual;
    tarjeta.dataset.cliente = pedido.getCliente();
    tarjeta.dataset.producto = pedido.getProducto();
    tarjeta.dataset.precio = pedido.getPrecioUnitario();
    tarjeta.dataset.cantidad = pedido.getCantidad();
    tarjeta.dataset.prioridad = pedido.getPrioridad();
    tarjeta.dataset.estado = pedido.getEstado();
    tarjeta.dataset.observaciones = pedido.getObservaciones();

    // TODO 3: Título h3 y párrafo de producto (Con ID único)
    const cabecera = document.createElement("div");
    cabecera.classList.add("cabecera-pedido");

    const infoTexto = document.createElement("div");
    const titulo = document.createElement("h3");
    titulo.textContent = `#${idActual} - ${pedido.getCliente()}`;

    const infoProducto = document.createElement("p");
    infoProducto.classList.add("linea-info");
    infoProducto.id = `info-producto-${idActual}`; // ID único inyectado
    infoProducto.innerHTML = `<strong>${pedido.getCantidad()}x</strong> ${pedido.getProducto()} (<span>${formatearEuros(pedido.getImporte())}</span>)`;

    infoTexto.appendChild(titulo);
    infoTexto.appendChild(infoProducto);
    cabecera.appendChild(infoTexto);

    // TODO 4: Dos etiquetas span (Con ID único en el estado)
    const etiquetas = document.createElement("div");
    etiquetas.classList.add("etiquetas");

    const badgeEstado = document.createElement("span");
    badgeEstado.classList.add("etiqueta", "estado-badge", `estado-${pedido.getEstado()}`);
    badgeEstado.id = `estado-${idActual}`; // ID único inyectado
    badgeEstado.textContent = nombreEstado(pedido.getEstado());

    const badgePrioridad = document.createElement("span");
    badgePrioridad.classList.add("etiqueta", `prioridad-${pedido.getPrioridad()}`);
    badgePrioridad.textContent = pedido.getPrioridad().toUpperCase();

    etiquetas.appendChild(badgeEstado);
    etiquetas.appendChild(badgePrioridad);

    // TODO 5: Botones internos de la tarjeta
    const acciones = document.createElement("div");
    acciones.classList.add("acciones");

    const btnEstado = document.createElement("button");
    btnEstado.type = "button";
    btnEstado.classList.add("btn-preparar");
    btnEstado.dataset.accion = "cambiar-estado";
    btnEstado.title = "Cambiar al siguiente estado";
    btnEstado.textContent = " Estado";

    const btnEditar = document.createElement("button");
    btnEditar.type = "button";
    btnEditar.classList.add("btn-editar");
    btnEditar.dataset.accion = "editar";
    btnEditar.title = "Editar observaciones";
    btnEditar.textContent = " Nota";

    const btnCancelar = document.createElement("button");
    btnCancelar.type = "button";
    btnCancelar.classList.add("btn-cancelar");
    btnCancelar.dataset.accion = "cancelar";
    btnCancelar.title = "Cancelar pedido";
    btnCancelar.textContent = " Cancelar";

    const btnEliminar = document.createElement("button");
    btnEliminar.type = "button";
    btnEliminar.classList.add("btn-eliminar");
    btnEliminar.dataset.accion = "eliminar";
    btnEliminar.title = "Eliminar de la lista";
    btnEliminar.textContent = "Eliminar";

    acciones.appendChild(btnEstado);
    acciones.appendChild(btnEditar);
    acciones.appendChild(btnCancelar);
    acciones.appendChild(btnEliminar);

    // TODO 6: Párrafo de observaciones (Con ID único) e inserción final
    const pObs = document.createElement("p");
    pObs.classList.add("linea-info", "muted", "txt-observaciones");
    pObs.id = `obs-${idActual}`; // ID único inyectado corrección fatal
    pObs.textContent = pedido.getObservaciones();

    tarjeta.appendChild(cabecera);
    tarjeta.appendChild(etiquetas);
    tarjeta.appendChild(pObs);
    tarjeta.appendChild(acciones);

    aplicarClaseEstado(tarjeta);

    return tarjeta;
  }

  // =====================================================
  // Actualización visual de una tarjeta
  // =====================================================
  // TODO 7: Aplicar clase contenedora según estado
  function aplicarClaseEstado(tarjeta) {
    tarjeta.classList.remove("pedido-preparando", "pedido-preparado", "pedido-cancelado");
    const estado = tarjeta.dataset.estado;

    if (estado === "preparando") tarjeta.classList.add("pedido-preparando");
    if (estado === "preparado") tarjeta.classList.add("pedido-preparado");
    if (estado === "cancelado") tarjeta.classList.add("pedido-cancelado");
  }

  // TODO 8: Actualizar tarjeta por IDs únicos planos
  function actualizarTarjetaTrasCambio(tarjeta) {
    const idPedido = tarjeta.dataset.id; // Corrección: recuperar ID del dataset
    const estado = tarjeta.dataset.estado;
    const cantidad = Number(tarjeta.dataset.cantidad);
    const precio = Number(tarjeta.dataset.precio);
    const producto = tarjeta.dataset.producto;
    const observaciones = tarjeta.dataset.observaciones;

    // - actualizar la etiqueta de estado buscando por su ID único
    const badgeEstado = document.getElementById(`estado-${idPedido}`);
    if (badgeEstado) {
      badgeEstado.className = "etiqueta"; 
      badgeEstado.classList.add(`estado-${estado}`);
      badgeEstado.textContent = nombreEstado(estado);
    }

    // - actualizar el texto del producto (e importe) buscando por su ID único
    const infoProducto = document.getElementById(`info-producto-${idPedido}`);
    if (infoProducto) {
      infoProducto.innerHTML = `<strong>${cantidad}x</strong> ${producto} (<span>${formatearEuros(precio * cantidad)}</span>)`;
    }

    // - actualizar las observaciones buscando por su ID único
    const txtObs = document.getElementById(`obs-${idPedido}`);
    if (txtObs) {
      txtObs.textContent = observaciones;
    }

    // - volver a aplicar la clase visual del estado
    aplicarClaseEstado(tarjeta);
  }

  // =====================================================
  // Resumen y detalle
  // =====================================================
  // TODO 9: Calcular estadísticas
  function actualizarResumen() {
    const tarjetas = listaPedidos.querySelectorAll(".pedido");
    const total = tarjetas.length;

    // Corrección de la clase singular ".pedido"
    const preparados = listaPedidos.querySelectorAll(".pedido[data-estado='preparado']").length;
    const cancelados = listaPedidos.querySelectorAll(".pedido[data-estado='cancelado']").length;
    const pendientes = total - preparados - cancelados;

    let acumulado = 0;
    tarjetas.forEach(tarjeta => {
      if (tarjeta.dataset.estado !== "cancelado") {
        const cantidad = Number(tarjeta.dataset.cantidad);
        const precio = Number(tarjeta.dataset.precio);
        acumulado += cantidad * precio;
      }
    });

    totalPedidos.textContent = total;
    totalPendientes.textContent = pendientes;
    totalPreparados.textContent = preparados;
    importeTotal.textContent = formatearEuros(acumulado);

    mensajeVacio.style.display = total === 0 ? "block" : "none";
  }

  // TODO 10: Seleccionar un único pedido
  function seleccionarPedido(tarjeta) {
    const todoSeleccionados = listaPedidos.querySelectorAll(".pedido.seleccionado");
    todoSeleccionados.forEach(p => p.classList.remove("seleccionado"));

    tarjeta.classList.add("seleccionado");
  }

  // =====================================================
  // Acciones sobre pedidos
  // =====================================================
  // TODO 11: Rotar estados
  function cambiarEstadoPedido(tarjeta) {
    if (tarjeta.dataset.estado === "cancelado") return;
    const estadoActual = tarjeta.dataset.estado;
    const proxEstado = siguienteEstado(estadoActual);

    tarjeta.dataset.estado = proxEstado;
    actualizarTarjetaTrasCambio(tarjeta);
    actualizarResumen();
  }

  // TODO 12: Editar observaciones por prompt
  function editarObservacionesPedido(tarjeta) {
    const observaciones = tarjeta.dataset.observaciones;
    const nuevasObs = prompt("Actualiza observaciones:", observaciones);

    if (nuevasObs === null) return;
    const filtrado = nuevasObs.trim();
    tarjeta.dataset.observaciones = filtrado === "" ? "Sin observaciones" : filtrado;

    actualizarTarjetaTrasCambio(tarjeta);
  }

  // TODO 13: Cancelar pedido
  function cancelarPedido(tarjeta) {
    tarjeta.dataset.estado = "cancelado";
    actualizarTarjetaTrasCambio(tarjeta);
    actualizarResumen();
  }

  // TODO 14: Eliminar nodo hijo
  function eliminarPedido(tarjeta) {
    listaPedidos.removeChild(tarjeta);
    actualizarResumen();
  }

  // =====================================================
  // Formulario: añadir pedido
  // =====================================================
  formPedido.addEventListener("submit", function (event) {
    event.preventDefault();

    // TODO 15: Recoger valores
    const cliente = inpCliente.value;
    const producto = selProducto.value;
    const precioUnitario = obtenerPrecioSeleccionado();
    const cantidad = inpCantidad.value;
    const prioridad = selPrioridad.value;
    const observaciones = txtObservaciones.value;

    // TODO 16: Instanciar Objeto
    const pedido = new Pedido(siguienteId, cliente, producto, precioUnitario, cantidad, prioridad, observaciones);

    // TODO 17: Inyectar en el DOM
    const tarjeta = crearTarjetaPedido(pedido);
    listaPedidos.appendChild(tarjeta);

    // TODO 18: Resetear contador e inputs de forma limpia
    siguienteId++;
    formPedido.reset(); // El reset de HTML ya limpia y pone valores por defecto automáticamente
    inpCliente.focus();

    actualizarResumen();
  });

  // =====================================================
  // Delegación de eventos en el contenedor de pedidos
  // =====================================================
  // TODO 19: Escuchar clics en botones o tarjeta completa
  listaPedidos.addEventListener("click", function (event) {
    const tarjeta = event.target.closest(".pedido");
    if (!tarjeta) return;

    const boton = event.target.closest("button[data-accion]");
    if (boton) {
      event.stopPropagation(); // Corrección: paréntesis añadidos
      const accion = boton.dataset.accion;

      if (accion === "cambiar-estado") cambiarEstadoPedido(tarjeta);
      if (accion === "editar") editarObservacionesPedido(tarjeta);
      if (accion === "cancelar") cancelarPedido(tarjeta);
      if (accion === "eliminar") eliminarPedido(tarjeta);

      return;
    }

    seleccionarPedido(tarjeta);
  });

  // =====================================================
  // Ordenar y limpiar pedidos
  // =====================================================
  // TODO 20: Purgar tarjetas completadas
  btnLimpiarPreparados.addEventListener("click", function () {
    const finalizados = listaPedidos.querySelectorAll(".pedido[data-estado='preparado'], .pedido[data-estado='cancelado']");
    finalizados.forEach(r => { listaPedidos.removeChild(r); });

    actualizarResumen();
  });

  // =====================================================
  // Estado inicial
  // =====================================================
  actualizarResumen();
  </script>
</body>
</html>
