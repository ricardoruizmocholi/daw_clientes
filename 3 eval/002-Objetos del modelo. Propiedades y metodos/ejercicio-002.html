<!DOCTYPE html>
<!--
Enunciado:

Desarrolla una tarjeta de juego personalizada:
	- La tarjeta de juego tiene unos valores por defecto
	- Se pueden cambiar todos sus valores mediante formulario
	- Lista de valores:
		- Título
		- Género
		- Plataforma
		- Portada (imagen)
		- Enlace a su página de Wikipedia
		- Pegi
		- Estado (Pendiente, Jugando o Completado)
		- Apariencia visual dependiendo de la plataforma
		- Botón de añadir a favoritos
			- Este estará habilitado o deshabilitado en función de un atributo interno
			- Este atributo se colocará a false en caso de ser un juego "Pendiente" o tener PEGI 18

Incorpora la funcionalidad del inspector de nodos a esta tarjeta de juego.
-->

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tarjetas de Videojuegos</title>
  <style>
    :root {
      --pc-color: #1a1a1a;
      --ps-color: #003791;
      --xbox-color: #107c10;
      --nintendo-color: #e60012;
    }

    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    .main-container { display: flex; gap: 30px; max-width: 1100px; width: 100%; flex-wrap: wrap; }

    /* Estilos del Formulario */
    .panel-control { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
    .campo { margin-bottom: 12px; }
    .campo label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    .campo input, .campo select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }

    /* Estilos de la Tarjeta */
    .tarjeta-juego { width: 320px; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: transform 0.3s; border-top: 10px solid var(--pc-color); }
    .tarjeta-juego.pc { border-top-color: var(--pc-color); }
    .tarjeta-juego.playstation { border-top-color: var(--ps-color); }
    .tarjeta-juego.xbox { border-top-color: var(--xbox-color); }
    .tarjeta-juego.nintendo { border-top-color: var(--nintendo-color); }

    .portada { width: 100%; height: 180px; object-fit: cover; background-color: #ddd; }
    .info { padding: 20px; }
    .genero { font-size: 12px; text-transform: uppercase; color: #666; font-weight: bold; }
    .pegi-tag { float: right; background: #333; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .estado-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; margin-top: 10px; font-weight: bold; }
    .pendiente { background: #fee2e2; color: #991b1b; }
    .jugando { background: #fef9c3; color: #854d0e; }
    .completado { background: #dcfce7; color: #166534; }

    .btn-fav { width: 100%; margin-top: 15px; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-fav:enabled { background: #f43f5e; color: white; }
    .btn-fav:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }

    /* Inspector de Nodos */
    .inspector { width: 100%; margin-top: 30px; background: #1e293b; color: #f8fafc; padding: 20px; border-radius: 12px; font-family: monospace; }
    .inspector h3 { margin-top: 0; color: #38bdf8; }
    pre { white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>

  <h1>Video Game Card DOM Lab</h1>

  <div class="main-container">
    <section class="panel-control">
      <h3>Configurar Juego</h3>
      <div class="campo">
        <label>Título</label>
        <input type="text" id="inTitulo" value="The Witcher 3">
      </div>
      <div class="campo">
        <label>Género</label>
        <input type="text" id="inGenero" value="RPG / Acción">
      </div>
      <div class="campo">
        <label>Plataforma</label>
        <select id="inPlataforma">
          <option value="pc">PC Master Race</option>
          <option value="playstation">PlayStation 5</option>
          <option value="xbox">Xbox Series X</option>
          <option value="nintendo">Nintendo Switch</option>
        </select>
      </div>
      <div class="campo">
        <label>URL Portada (Img)</label>
        <input type="text" id="inPortada" value="https://image.api.playstation.com/vulcan/ap/rnd/202211/0711/kh4MUIuMmHlktfsS9ArjRndm.png">
      </div>
      <div class="campo">
        <label>Wikipedia (href)</label>
        <input type="text" id="inWiki" value="https://es.wikipedia.org/wiki/The_Witcher_3:_Wild_Hunt">
      </div>
      <div class="campo">
        <label>PEGI</label>
        <select id="inPegi">
          <option value="3">PEGI 3</option>
          <option value="12">PEGI 12</option>
          <option value="16">PEGI 16</option>
          <option value="18" selected>PEGI 18</option>
        </select>
      </div>
      <div class="campo">
        <label>Estado</label>
        <select id="inEstado">
          <option value="pendiente">Pendiente</option>
          <option value="jugando" selected>Jugando</option>
          <option value="completado">Completado</option>
        </select>
      </div>
      <button onclick="actualizarTarjeta()" style="width:100%; padding:10px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer;">
        Actualizar Tarjeta
      </button>
    </section>

    <section>
      <article id="cardJuego" class="tarjeta-juego pc" data-fav-eligible="true">
        <img id="domPortada" src="" alt="Portada" class="portada">
        <div class="info">
          <span id="domPegi" class="pegi-tag">18</span>
          <span id="domGenero" class="genero">RPG</span>
          <h2 id="domTitulo" style="margin: 10px 0;">Título del Juego</h2>
          <p>Plataforma: <strong id="domPlat">PC</strong></p>
          <a id="domWiki" href="#" target="_blank">Leer en Wikipedia</a>
          <br>
          <span id="domEstado" class="estado-badge">Estado</span>
          
          <button id="btnFavorito" class="btn-fav">
            ❤ Añadir a Favoritos
          </button>
        </div>
      </article>
      <button onclick="analizarNodos()" style="margin-top:20px; width:100%;">🔍 Analizar Nodos Internos</button>
    </section>
  </div>

  <section class="inspector">
    <h3>Inspector de Nodos (#cardJuego)</h3>
    <div id="salidaNodos">Pulsa el botón para analizar la estructura...</div>
  </section>

  <script>
    // Referencias DOM
    const card = document.getElementById('cardJuego');
    const btnFav = document.getElementById('btnFavorito');

    function actualizarTarjeta() {
      // 1. Obtener valores de los inputs
      const titulo = document.getElementById('inTitulo').value;
      const genero = document.getElementById('inGenero').value;
      const plataforma = document.getElementById('inPlataforma').value;
      const portada = document.getElementById('inPortada').value;
      const wiki = document.getElementById('inWiki').value;
      const pegi = document.getElementById('inPegi').value;
      const estado = document.getElementById('inEstado').value;

      // 2. Aplicar cambios a la tarjeta (Contenido y Atributos)
      document.getElementById('domTitulo').textContent = titulo;
      document.getElementById('domGenero').textContent = genero;
      document.getElementById('domPortada').src = portada;
      document.getElementById('domWiki').href = wiki;
      document.getElementById('domPegi').textContent = pegi;
      document.getElementById('domPlat').textContent = plataforma.toUpperCase();
      
      const badge = document.getElementById('domEstado');
      badge.textContent = estado.toUpperCase();
      badge.className = `estado-badge ${estado}`;

      // 3. Cambiar apariencia según plataforma (Clases)
      card.className = `tarjeta-juego ${plataforma}`;

      // 4. Lógica de Atributo Interno y Botón Favoritos
      // Regla: No elegible si es Pendiente O PEGI 18
      let esElegible = true;
      if (estado === 'pendiente' || pegi === '18') {
        esElegible = false;
      }
      
      // Seteamos atributo personalizado (data-attribute)
      card.setAttribute('data-fav-eligible', esElegible);
      
      // Habilitar/Deshabilitar según el atributo
      btnFav.disabled = (card.getAttribute('data-fav-eligible') === 'false');
      
      // Actualizar inspector automáticamente
      analizarNodos();
    }

    function analizarNodos() {
      const infoArea = document.getElementById('salidaNodos');
      let html = `<pre><strong>Análisis de la Estructura:</strong>\n`;
      html += `Total childNodes (incluye texto/saltos): ${card.childNodes.length}\n`;
      html += `Total children (solo elementos HTML): ${card.children.length}\n`;
      html += `-------------------------------------------\n`;
      
      // Listar hijos directos usando children
      Array.from(card.childNodes).forEach((nodo, idx) => {
        let tipo = "";
        if(nodo.nodeType === 1) tipo = "ELEMENTO (<" + nodo.tagName + ">)";
        if(nodo.nodeType === 3) {
            const esEspacio = !/[^\t\n\r ]/.test(nodo.textContent);
            tipo = esEspacio ? "TEXTO (Salto de línea/Espacio)" : "TEXTO (Contenido)";
        }
        
        html += `[Hijo ${idx}] Tipo: ${tipo}\n`;
      });

      html += `\n<strong>Atributos actuales de la tarjeta:</strong>\n`;
      html += `- Class: ${card.className}\n`;
      html += `- data-fav-eligible: ${card.getAttribute('data-fav-eligible')}\n`;
      
      html += `</pre>`;
      infoArea.innerHTML = html;
    }

    // Inicializar
    actualizarTarjeta();
  </script>
</body>
</html>
